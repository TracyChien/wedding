<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo & Tracy · 2026.04.25</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:  #FBF5EC;
    --warm:   #F2E4CC;
    --blush:  #F5E6DC;
    --sage:   #7A9468;
    --brown:  #9B7248;
    --text:   #6B4F38;
    --muted:  #B09A85;
    --gold:   #C8A25A;
    --white:  #FFFDF8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Noto Serif TC', serif;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem 5rem;
    position: relative;
    background:
      radial-gradient(ellipse 80% 60% at 10% 5%,  #f5dfc825 0%, transparent 65%),
      radial-gradient(ellipse 60% 50% at 90% 90%, #e8c8b820 0%, transparent 65%),
      radial-gradient(ellipse 40% 60% at 90% 5%,  #c8d8b815 0%, transparent 65%),
      #FBF5EC;
  }

  .invite-card {
    width: min(360px, 78vw);
    margin: 0 auto 2.5rem;
    display: block;
    filter: drop-shadow(0 16px 48px rgba(160,120,80,0.22));
    animation: float 7s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .scroll-down {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    animation: nudge 2.5s ease-in-out infinite;
    text-decoration: none;
  }
  @keyframes nudge {
    0%,100% { opacity:0.5; transform:translateY(0); }
    50%      { opacity:1;   transform:translateY(6px); }
  }

  /* ── GALLERY SECTION ── */
  .gallery-section {
    max-width: 1140px;
    margin: 0 auto;
    padding: 5rem 1.25rem 6rem;
  }
  .section-head {
    text-align: center;
    margin-bottom: 3rem;
  }
  .section-head h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-style: italic;
    color: var(--brown);
    font-weight: 400;
    margin-bottom: 0.8rem;
  }
  .gold-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--gold);
    font-size: 0.6rem;
    letter-spacing: 0.4em;
  }
  .gold-line::before, .gold-line::after {
    content: '';
    display: block;
    width: 70px;
    height: 1px;
  }
  .gold-line::before { background: linear-gradient(to right, transparent, var(--gold)); }
  .gold-line::after  { background: linear-gradient(to left,  transparent, var(--gold)); }

  /* ── TABS ── */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 2.5rem;
  }
  .tab-btn {
    border: 1px solid rgba(192,160,112,0.4);
    background: rgba(255,253,248,0.7);
    padding: 0.5rem 1.3rem;
    border-radius: 60px;
    font-family: 'Noto Serif TC', serif;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn:hover { border-color: var(--gold); color: var(--brown); }
  .tab-btn.active {
    background: var(--brown);
    border-color: var(--brown);
    color: var(--white);
    box-shadow: 0 3px 14px rgba(160,120,80,0.25);
  }
  .tab-btn svg {
    width: 13px; height: 13px;
    stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
  }

  /* ── GRIDS ── */
  .gallery-grid { display: none; }
  .gallery-grid.active {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    animation: fadeUp 0.4s ease;
  }
  #grid-incard.active {
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  #grid-incard .photo-card {
    aspect-ratio: 3/4;
  }
  .photo-card--portrait {
    aspect-ratio: 3/4 !important;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* ── PHOTO CARD ── */
  .photo-card {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 4/3;
    cursor: pointer;
    background: var(--warm);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid rgba(192,160,112,0.2);
  }
  .photo-card:hover {
    transform: scale(1.025) translateY(-3px);
    box-shadow: 0 14px 36px rgba(160,120,80,0.18);
  }
  .photo-card img {
    width:100%; height:100%;
    object-fit: cover;
    display: block;
  }
  .photo-card .hover-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(100,70,40,0.42) 0%, transparent 55%);
    opacity: 0;
    transition: opacity 0.25s;
    display: flex; align-items: flex-end; padding: 1rem;
  }
  .photo-card:hover .hover-overlay { opacity: 1; }
  .hover-overlay span {
    color: rgba(255,250,240,0.85);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
  }

  /* ── SKELETON ── */
  .skeleton {
    border-radius: 14px;
    aspect-ratio: 4/3;
    background: linear-gradient(90deg, var(--warm) 25%, #f5e8d0 50%, var(--warm) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .state-msg {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    line-height: 2;
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    position: fixed; inset: 0; z-index: 999;
    display: none;
    background: rgba(28,18,10,0.93);
    backdrop-filter: blur(10px);
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: min(92vw, 1100px);
    max-height: 90vh;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    animation: lbIn 0.22s ease;
  }
  @keyframes lbIn {
    from { opacity:0; transform:scale(0.94); }
    to   { opacity:1; transform:scale(1); }
  }
  .lb-btn {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: rgba(255,250,240,0.9);
    font-size: 1.4rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    backdrop-filter: blur(6px);
  }
  .lb-btn:hover { background: rgba(255,255,255,0.18); }
  .lb-close { top:1.2rem; right:1.2rem; font-size:1rem; }
  .lb-prev  { left:1rem;  top:50%; transform:translateY(-50%); }
  .lb-next  { right:1rem; top:50%; transform:translateY(-50%); }
  .lb-count {
    position: absolute;
    bottom:1.2rem; left:50%;
    transform: translateX(-50%);
    color: rgba(255,250,240,0.5);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
  }

  /* ── VENDORS ── */
  .vendors {
    background: var(--warm);
    padding: 5rem 1.25rem 4rem;
    border-top: 1px solid rgba(192,160,112,0.2);
  }
  .vendors-inner {
    max-width: 900px;
    margin: 0 auto;
  }
  .vendor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    margin-top: 2.5rem;
  }
  .vendor-card {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.9rem 1.1rem;
    border-radius: 14px;
    background: rgba(255,253,248,0.7);
    border: 1px solid rgba(192,160,112,0.25);
    text-decoration: none;
    color: var(--text);
    transition: all 0.2s ease;
    backdrop-filter: blur(6px);
  }
  .vendor-card:hover {
    background: rgba(255,253,248,0.95);
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(160,120,80,0.12);
  }
  .vendor-card > svg:first-child {
    width: 18px; height: 18px; flex-shrink: 0;
    stroke: var(--gold); fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .vendor-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .vendor-role {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .vendor-name {
    font-size: 0.85rem;
    color: var(--brown);
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vendor-arrow {
    width: 14px; height: 14px; flex-shrink: 0;
    stroke: var(--muted); fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    transition: stroke 0.2s;
  }
  .vendor-card:hover .vendor-arrow { stroke: var(--gold); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    border-top: 1px solid rgba(192,160,112,0.2);
  }
  footer .heart { color: #D4A0A0; }

  @media (max-width: 600px) {
    .gallery-grid.active {
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }
  }
</style>
</head>

<script>
// ── 把這裡換成你的 Apps Script 網址 ──
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhPiJLEycrItGmmbHvU_9Gw4GoH66IehvEyA1VzKmr1rWMpnxWQVe7b-tZjCQar8gX6w/exec';

const cache = {};
let lbPhotos = [], lbIdx = 0;

function thumb(id) { return `https://drive.google.com/thumbnail?id=${id}&sz=w600`; }
function full(id)  { return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`; }

function showSkeletons(grid, n) {
  grid.innerHTML = Array(n).fill('<div class="skeleton"></div>').join('');
}

function renderCards(grid, ids) {
  if (!ids.length) {
    grid.innerHTML = '<p class="state-msg">暫無照片</p>';
    return;
  }
  const photos = ids.map(id => ({ thumb: thumb(id), full: full(id) }));
  cache[currentTab] = photos;
  lbPhotos = photos;
  const isIncard = currentTab === 'incard';
  grid.innerHTML = photos.map((p, i) => `
    <div class="photo-card${isIncard ? ' photo-card--portrait' : ''}" onclick="lbOpen(${i})">
      <img src="${p.thumb}" alt="photo ${i+1}" loading="lazy"
           onerror="this.closest('.photo-card').style.display='none'">
      <div class="hover-overlay"><span>${i+1} / ${photos.length}</span></div>
    </div>`).join('');
}

let currentTab = 'wedding';

async function loadTab(key) {
  currentTab = key;
  if (cache[key]) { lbPhotos = cache[key]; return; }
  const grid = document.getElementById('grid-' + key);
  showSkeletons(grid, 12);
  try {
    const res = await fetch(`${SCRIPT_URL}?tab=${key}`);
    const data = await res.json();
    renderCards(grid, data.ids || []);
  } catch(e) {
    grid.innerHTML = `<p class="state-msg">載入失敗，請確認 Apps Script 已部署<br><small style="opacity:.6">${e.message}</small></p>`;
  }
}

function switchTab(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const key = btn.dataset.tab;
  document.querySelectorAll('.gallery-grid').forEach(g => g.classList.remove('active'));
  document.getElementById('grid-' + key).classList.add('active');
  loadTab(key);
}

function lbOpen(i) {
  lbIdx = i; lbShow();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function lbShow() {
  document.getElementById('lb-img').src = lbPhotos[lbIdx].full;
  document.getElementById('lb-count').textContent = `${lbIdx+1} / ${lbPhotos.length}`;
}
function lbNav(d) {
  lbIdx = (lbIdx + d + lbPhotos.length) % lbPhotos.length;
  lbShow();
}
function lbClose() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function lbBgClick(e) {
  if (e.target === document.getElementById('lightbox')) lbClose();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape')      lbClose();
  if (e.key === 'ArrowRight')  lbNav(1);
  if (e.key === 'ArrowLeft')   lbNav(-1);
});

loadTab('wedding');
</script>
</body>
</html>
